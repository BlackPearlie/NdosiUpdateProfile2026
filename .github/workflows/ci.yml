name: Playwright CI

on:
  push:
    branches: [ main ]
  schedule:
    # Run daily at 00:00 SAST (UTC+2) -> 22:00 UTC previous day
    - cron: '0 22 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Prepare (Playwright browsers + decode image)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: npm run prepare
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NDOSI_USERNAME: ${{ secrets.NDOSI_USERNAME }}
          NDOSI_PASSWORD: ${{ secrets.NDOSI_PASSWORD }}
          PROFILE_PICTURE: assets/mpho.jpg
        run: xvfb-run --auto-servernum npm test
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
